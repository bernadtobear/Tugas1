<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 4 Kei - JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="kei.jpg" alt="Foto Kei">
        <div>
            <h2>Kei</h2>
            <p>NIM: 255314150</p>
            <p>Program Studi Informatika</p>
        </div>
    </header>

    <main class="container">
        <h1>Tugas 4 Kei - JavaScript</h1>
        <div class="form-row">
            <label for="nama">
                Nama :
            </label>
            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama"
            >
        </div>

        <div class="form-row">
            <label for="jumlah">
                Jumlah Pilihan :
            </label>
            <input
                type="number"
                id="jumlah"
                min="1"
                max="20"
                placeholder="Jumlah"
            >
        </div>


        <div class="button-area">
            <button id="btnJumlah">
                OK
            </button>
        </div>

        <div id="pilihanContainer"></div>
        <div id="pilihanAkhir"></div>
        <div id="emailContainer"></div>
        <div id="output"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
